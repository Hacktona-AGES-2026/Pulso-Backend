# Postgres local do Pulso: docker compose up -d db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pulso
      POSTGRES_PASSWORD: pulso
      POSTGRES_DB: pulso
    ports:
      - "5432:5432"
    volumes:
      - pulso-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulso"]
      interval: 2s
      retries: 30

volumes:
  pulso-db:
